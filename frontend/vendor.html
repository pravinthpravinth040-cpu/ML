*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
main{flex:1;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:22px}h2{font-size:17px;margin-bottom:8px}.mut{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:600 16px inherit;width:100%;padding:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
select,input[type=range]{width:100%;min-height:48px;font:16px inherit;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px}
input[type=range]{padding:0;accent-color:var(--pri)}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mut);font:600 12px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button span{font-size:22px}nav button.on{color:var(--pri)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.gauge{display:block;margin:4px auto}.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;color:#fff}
.alert{border-left:5px solid var(--bad);background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px;border:1px solid var(--bd);border-left:5px solid var(--bad)}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:9px}
.tog{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--bd)}
.tog input{width:24px;height:24px;accent-color:var(--pri)}
.big{font-size:26px;font-weight:800}.lang{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:99px;min-height:36px;padding:0 12px;font:600 13px inherit;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .6s}.scr{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}}

function gauge(s){const c=band(s)[1],r=64,L=Math.PI*r,o=L*(1-s/100);
 return `<svg class="gauge" width="170" height="104" viewBox="0 0 170 104" role="img" aria-label="${s} out of 100"><path d="M21 90A64 64 0 0 1 149 90" fill="none" stroke="var(--bd)" stroke-width="14" stroke-linecap="round"/><path d="M21 90A64 64 0 0 1 149 90" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${o}"/><text x="85" y="82" text-anchor="middle" font-size="34" font-weight="800" fill="var(--tx)">${s}</text></svg>`}
function login(){$("nav").hidden=true;
 $("m").innerHTML=`<div class="scr" style="padding-top:8vh"><div style="font-size:48px">🤝</div><h1>TrustCred</h1><p class="mut" style="margin:6px 0 24px">${S.lang=="en"?"Your daily sales are your credit history.":"உங்கள் தினசரி விற்பனையே உங்கள் கடன் வரலாறு."}</p><label class="mut" for="vs">${t("login")}</label><select id="vs">${DATA.map(x=>`<option>${x.vendor_id}</option>`).join("")}</select><div style="height:14px"></div><button class="btn" id="go">${t("go")}</button><div style="height:14px"></div><button class="lang" id="lg">${S.lang=="en"?"தமிழ்":"English"}</button><div style="height:16px"></div><a href="index.html" class="mut" style="text-decoration:none;font-size:13px;display:inline-block">🏢 Switch to Underwriter Dashboard</a></div>`;
 $("go").onclick=()=>{S.vid=$("vs").value;S.amt=V().loan_amount_requested;S.tab="home";S.stopped=false;render()};
 $("lg").onclick=toggleLang}
function toggleLang(){S.lang=S.lang=="en"?"ta":"en";try{localStorage.setItem("lang",S.lang)}catch(e){};render()}
function nav(){const n=$("nav");n.hidden=false;const it=[["home","🏠",t("home")],["cf","📊",t("cf")],["loan","💰",t("loan")],["me","👤",t("me")]];
 n.innerHTML=it.map(i=>`<button data-k="${i[0]}" class="${S.tab==i[0]?"on":""}" aria-label="${i[2]}"><span>${i[1]}</span>${i[2]}</button>`).join("");
 n.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;render()})}
function home(v){const r=calc(v,S.amt,S.mths),b=band(r.sc);
 const al=v.reciprocal_transfer_share>0?`<div class="alert" role="alert"><b>⚠ ${t("warn")}</b><p class="mut">${t("warnT")}</p></div>`:"";
 return `<div class="row" style="margin-bottom:14px"><div><p class="mut">${t("hi")},</p><h1>${v.vendor_id}</h1></div><button class="lang" id="lg">${S.lang=="en"?"தமிழ்":"English"}</button></div>${al}
 <div class="card" style="text-align:center"><p class="mut">${t("score")}</p>${gauge(r.sc)}<span class="badge" style="background:${b[1]}">${b[0]}</span><p class="mut" style="margin-top:8px">${t("of")}</p></div>
 <div class="row" style="gap:10px;margin-bottom:14px">${[[t("inc"),v.total_receipts,"var(--ok)"],[t("exp"),v.total_expenses,"var(--bad)"],[t("net"),v.net_cashflow,"var(--pri)"]].map(x=>`<div class="card" style="flex:1;margin:0;padding:12px"><p class="mut" style="font-size:12px">${x[0]}</p><b style="color:${x[2]};font-size:15px">${inr(x[1])}</b></div>`).join("")}</div>
 <div class="card"><h2>${t("why")}</h2>${r.f.map(x=>{const p=x[2]/x[1];return `<div style="margin-bottom:10px"><div class="row"><b style="font-size:14px">${x[0]}</b><span class="mut">${x[2].toFixed(0)}/${x[1]}</span></div><div class="bar"><i style="width:${p*100}%;background:${p>.7?"var(--ok)":p>.4?"var(--wa)":"var(--bad)"}"></i></div><p class="mut" style="font-size:13px">${x[3]}</p></div>`}).join("")}<p class="mut" style="font-size:12px">${t("demo")}</p></div>`}
function cf(v){const ks=Object.keys(days),vals=ks.map(k=>v.monthly_receipts[k]),mx=Math.max(...vals);
 return `<h1 style="margin-bottom:14px">${t("cf")}</h1><div class="card"><h2>${t("inc")} (Jul – Sep 28)</h2><svg viewBox="0 0 300 150" width="100%" role="img" aria-label="Monthly sales">${vals.map((x,i)=>{const h=x/mx*100;return `<rect x="${30+i*90}" y="${115-h}" width="60" height="${h}" rx="8" fill="var(--pri)"/><text x="${60+i*90}" y="${108-h}" text-anchor="middle" font-size="11" fill="var(--tx)">${inr(x/1000)}k</text><text x="${60+i*90}" y="138" text-anchor="middle" font-size="12" fill="var(--mut)">${MN[ks[i]]}</text>`}).join("")}</svg><p class="mut" style="font-size:12px">Sep covers 28 days only.</p></div>
 <div class="card">${[[t("inc"),v.total_receipts],[t("exp"),v.total_expenses],[t("net"),v.net_cashflow],["Customers",v.unique_customers,1],["Payments received",v.txn_count,1]].map(x=>`<div class="tog"><span>${x[0]}</span><b>${x[2]?x[1].toLocaleString("en-IN"):inr(x[1])}</b></div>`).join("")}</div>`}
function loan(v){const r=calc(v,S.amt,S.mths),c=r.cover>=2?["good","var(--ok)"]:r.cover>=1?["ok","var(--wa)"]:["risk","var(--bad)"];
 return `<h1 style="margin-bottom:14px">${t("loan")}</h1><div class="card"><div class="row"><label for="a">${t("req")}</label><b id="av">${inr(S.amt)}</b></div><input id="a" type="range" min="10000" max="100000" step="5000" value="${S.amt}"><div class="row" style="margin-top:12px"><label for="mo">${t("mon")}</label><b id="mv">${S.mths}</b></div><input id="mo" type="range" min="6" max="24" step="3" value="${S.mths}"></div>
 <div class="card" style="text-align:center"><p class="mut">${t("emi")}</p><p class="big" id="ev">${inr(r.emi)}</p><p class="mut" id="cv">${t("cov")} ${r.cover.toFixed(1)}x</p><span class="badge" id="cb" style="background:${c[1]}">${t(c[0])}</span><p class="mut" style="font-size:12px;margin-top:8px">${t("ill")}</p></div>
 <div class="card"><h2>${t("tips")}</h2><p class="mut">• Take UPI payments from many customers.<br>• Keep sales steady through the month.<br>• Do not move money back and forth with other vendors.</p></div>`}
function me(v){const o=[["r","Score report"],["e","Reasons for the score"],["m","Monthly summary"],["c","Payment documents"]];
 return `<h1 style="margin-bottom:14px">${t("me")} · ${v.vendor_id}</h1><div class="card"><h2>${t("share")}</h2><p class="mut" style="margin-bottom:6px">${t("shareT")}</p>${S.stopped?`<p class="alert" style="border-left-color:var(--ok)">✔ ${t("stopped")}</p>`:o.map(x=>`<label class="tog">${x[1]}<input type="checkbox" data-s="${x[0]}" ${S.share[x[0]]?"checked":""}></label>`).join("")+`<div style="height:12px"></div><button class="btn ghost" id="st">${t("stop")}</button>`}</div><button class="btn ghost" id="lo">${t("out")}</button><div style="height:12px"></div><a href="index.html" class="btn ghost" style="text-decoration:none;display:flex;align-items:center;justify-content:center">🏢 Underwriter Dashboard</a>`}
function render(){if(!S.vid)return login();nav();const v=V();
 $("m").innerHTML=`<div class="scr">${{home,cf,loan,me}[S.tab](v)}</div>`;$("m").scrollTop=0;
 const lg=$("lg");if(lg)lg.onclick=toggleLang;
 if(S.tab=="loan"){const upd=()=>{S.amt=+$("a").value;S.mths=+$("mo").value;const r=calc(v,S.amt,S.mths),c=r.cover>=2?["good","var(--ok)"]:r.cover>=1?["ok","var(--wa)"]:["risk","var(--bad)"];
  $("av").textContent=inr(S.amt);$("mv").textContent=S.mths;$("ev").textContent=inr(r.emi);$("cv").textContent=t("cov")+" "+r.cover.toFixed(1)+"x";$("cb").textContent=t(c[0]);$("cb").style.background=c[1]};$("a").oninput=upd;$("mo").oninput=upd}
 if(S.tab=="me"){
  document.querySelectorAll("[data-s]").forEach(i=>i.onchange=()=>S.share[i.dataset.s]=i.checked?1:0);
  const st=$("st");if(st)st.onclick=()=>{S.stopped=true;render()};$("lo").onclick=()=>{S.vid=null;render()

  }
}
}
render();
</script>
</body>
