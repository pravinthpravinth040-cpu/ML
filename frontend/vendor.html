<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TrustCred — Vendor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bot.css">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --card-bg: #ffffff;
      --border: #f1f5f9;
      --border-strong: #e2e8f0;
      --tx: #0f172a;
      --tx-mut: #64748b;
      --tx-subtle: #94a3b8;
      --pri: #2563eb;
      --pri-light: #eff6ff;
      --pri-hover: #1d4ed8;
      --ok: #059669;
      --ok-light: #ecfdf5;
      --wa: #d97706;
      --wa-light: #fffbeb;
      --bad: #e11d48;
      --bad-light: #fff1f2;
      --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --fintech-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-card: 0 2px 12px -2px rgba(15, 23, 42, 0.05);
      --shadow-elevated: 0 10px 25px -4px rgba(15, 23, 42, 0.08);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f1f5f9; color: var(--tx); font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; justify-content: center; align-items: stretch; }

    #app {
      width: 100%;
      max-width: 440px;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.06);
    }

    /* Top Instagram-Style Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--tx);
    }
    .brand-logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--fintech-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Instagram-Style Story Highlights */
    .stories-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      scrollbar-width: none;
    }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: 0;
      font-family: inherit;
    }
    .story-ring {
      width: 58px;
      height: 58px;
      border-radius: var(--radius-full);
      padding: 2.5px;
      background: var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .story-item.active .story-ring {
      background: var(--fintech-gradient);
    }
    .story-ring:active { transform: scale(0.92); }
    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 2px solid var(--surface);
    }
    .story-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--tx-mut);
      max-width: 62px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .story-item.active .story-title {
      color: var(--pri);
      font-weight: 700;
    }

    /* Main Scrollable Canvas */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      background: #fbfcfd;
    }

    /* Instagram-Style Feed Cards */
    .ig-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s ease;
    }
    .ig-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .ig-card-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ig-avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--pri-light);
      color: var(--pri);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      border: 1.5px solid rgba(37, 99, 235, 0.2);
    }
    .ig-user-name { font-size: 14px; font-weight: 700; color: var(--tx); line-height: 1.2; }
    .ig-user-sub { font-size: 12px; color: var(--tx-mut); }

    /* Typography & Utilities */
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 6px; }
    .mut { color: var(--tx-mut); font-size: 13.5px; line-height: 1.5; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    /* Pills & Badges */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .badge-pill--ok { background: var(--ok-light); color: var(--ok); }
    .badge-pill--wa { background: var(--wa-light); color: var(--wa); }
    .badge-pill--bad { background: var(--bad-light); color: var(--bad); }

    .lang-pill-btn {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--tx);
      border-radius: var(--radius-full);
      min-height: 34px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .lang-pill-btn:hover { background: #f8fafc; border-color: var(--tx-mut); }

    /* Buttons */
    .btn {
      min-height: 46px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--pri);
      color: #fff;
      font: 600 15px inherit;
      width: 100%;
      padding: 10px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: var(--pri-hover); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.ghost {
      background: var(--surface);
      color: var(--tx);
      border: 1px solid var(--border-strong);
    }
    .btn.ghost:hover { background: #f8fafc; border-color: var(--tx-mut); }
    .btn.primary-gradient {
      background: var(--fintech-gradient);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    /* Metric Grid (Instagram Stories Profile Stats Style) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
    }
    .stat-label { font-size: 11.5px; font-weight: 600; color: var(--tx-mut); margin-bottom: 2px; }
    .stat-val { font-size: 15px; font-weight: 800; color: var(--tx); }

    /* Sliders & Inputs */
    select, input[type=range] {
      width: 100%;
      min-height: 44px;
      font: 15px inherit;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--tx);
      padding: 8px 12px;
      outline: none;
    }
    select:focus { border-color: var(--pri); ring: 2px var(--pri-light); }
    input[type=range] {
      padding: 0;
      accent-color: var(--pri);
      height: 6px;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      border: 0;
    }

    /* Bottom Instagram Navigation Bar */
    nav#nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      height: calc(60px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
    }
    nav#nav button {
      flex: 1;
      height: 100%;
      border: 0;
      background: none;
      color: var(--tx-subtle);
      font: 600 11px inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    nav#nav button svg { width: 22px; height: 22px; stroke-width: 2; transition: transform 0.15s ease; }
    nav#nav button.on { color: var(--pri); font-weight: 700; }
    nav#nav button.on svg { stroke-width: 2.5; transform: scale(1.08); }

    /* Alert Banner */
    .alert-banner {
      background: var(--bad-light);
      border: 1px solid rgba(225, 29, 72, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .alert-banner b { color: var(--bad); font-size: 13.5px; }
    .alert-banner p { color: #9f1239; font-size: 12.5px; margin-top: 2px; }

    /* Progress Bar */
    .bar { height: 8px; border-radius: var(--radius-full); background: #e2e8f0; overflow: hidden; margin: 6px 0 3px; }
    .bar i { display: block; height: 100%; border-radius: var(--radius-full); }

    /* Toggle Switches */
    .tog {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
    }
    .tog input { width: 20px; height: 20px; accent-color: var(--pri); }

    /* TTS Controls */
    .tts-ctrls {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-elevated);
    }
    .speed-group { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .speed-btn {
      flex: 1;
      min-height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: #f8fafc;
      color: var(--tx);
      font: 600 12.5px inherit;
      cursor: pointer;
    }
    .speed-btn.on { background: var(--pri); color: #fff; border-color: var(--pri); }

    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }
    .step-card.active-step {
      border-color: var(--pri);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: var(--pri-light);
    }
    .step-tts-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--tx);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.15s ease;
    }
    .step-tts-btn:hover { background: var(--pri-light); color: var(--pri); border-color: var(--pri); }

    .both-sub { color: var(--tx-mut); font-size: 12.5px; display: block; margin-top: 3px; font-weight: 400; line-height: 1.4; }
  </style>
</head>

    `${v.unique_customers.toLocaleString("en-IN")} different customers paid you.`,
    v.reciprocal_transfer_share>0?"Money moving between vendors was found.":"No back-and-forth transfers found."
  ][i];
  const dTa = [
    `மாதங்களுக்கிடையே தினசரி விற்பனை ${(r.cv*100).toFixed(0)}% மாறியுள்ளது.`,
    `மாத மிச்சம் ${inr(r.mNet)}, தவணை ${inr(r.emi)}-ஐ விட ${r.cover.toFixed(1)} மடங்கு அதிகம்.`,
    `செலவு விற்பனையில் ${(er*100).toFixed(0)}% ஆக உள்ளது.`,
    `${v.unique_customers.toLocaleString("en-IN")} வெவ்வேறு வாடிக்கையாளர்கள் பணம் செலுத்தினர்.`,
    v.reciprocal_transfer_share>0?"வியாபாரிகளிடையே பணம் சுழல்வது கண்டறியப்பட்டது.":"பணம் முன்னும் பின்னும் சுழலவில்லை."
  ][i];
  if(S.lang==="ta") return dTa;
  if(S.lang==="both") return `${dTa}<span class="both-sub">${dEn}</span>`;
  return dEn;
}

function calc(v,amt,mths){
  const d=Object.keys(days).map(k=>v.monthly_receipts[k]/days[k]),avg=d.reduce((a,b)=>a+b)/3;
  const cv=Math.sqrt(d.reduce((a,b)=>a+(b-avg)**2,0)/3)/avg, mNet=v.net_cashflow/3;
  const emi=amt*(1+0.2*mths/12)/mths, cover=mNet/emi, er=v.total_expenses/v.total_receipts;
  const f=[
    ["Steady income",25,25*(1-Math.min(cv,.3)/.3),"Daily sales changed "+(cv*100).toFixed(0)+"% between months."],
    ["Can repay",30,30*Math.min(Math.max(cover,0)/3,1),"Monthly savings "+inr(mNet)+" cover a "+inr(emi)+" instalment "+cover.toFixed(1)+"x."],
    ["Low costs",15,15*(1-Math.min(Math.max((er-.1)/.5,0),1)),"Expenses were "+(er*100).toFixed(0)+"% of sales."],
    ["Many customers",15,15*Math.min(v.unique_customers/1000,1),v.unique_customers.toLocaleString("en-IN")+" different customers paid you."],
    ["Genuine sales",15,15*(1-v.reciprocal_transfer_share),v.reciprocal_transfer_share>0?"Money moving between vendors was found.":"No back-and-forth transfers found."]
  ];
  let sc=Math.round(f.reduce((a,x)=>a+x[2],0)); if(v.reciprocal_transfer_share>0) sc=Math.min(sc,40);
  return {f,sc,emi,cover,mNet,cv};
}

const band=s=>s>=75?["Strong",'var(--ok)','badge-pill--ok']:s>=55?["Good",'var(--ok)','badge-pill--ok']:s>=35?["Fair",'var(--wa)','badge-pill--wa']:["Low",'var(--bad)','badge-pill--bad'];

function gauge(s){
  const c=band(s)[1],r=62,L=Math.PI*r,o=L*(1-s/100);
  return `<svg class="gauge" width="180" height="110" viewBox="0 0 180 110" role="img" aria-label="${s} out of 100" style="display:block;margin:0 auto">
    <path d="M22 96A62 62 0 0 1 158 96" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
    <path d="M22 96A62 62 0 0 1 158 96" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${o}"/>
    <text x="90" y="88" text-anchor="middle" font-size="38" font-weight="800" fill="var(--tx)" font-family="inherit">${s}</text>
  </svg>`;
}

// Speech & TTS Engine
let ttsState="idle", activeStep=-1, ttsQueue=[], audioEl=null, audioFilesAvailable=false, audioChecked=false;

function prepareSpeechText(text, lang){
  if(!text) return "";
  let clean = text.replace(/<[^>]+>/g, " ");
  if(lang==="ta"){
    clean = clean.replace(/₹\s*([0-9,]+)/g, "$1 ரூபாய் ");
    clean = clean.replace(/₹/g, "ரூபாய் ");
    clean = clean.replace(/%/g, " சதவீதம்");
  } else {
    clean = clean.replace(/₹\s*([0-9,]+)/g, "$1 rupees ");
    clean = clean.replace(/₹/g, "rupees ");
    clean = clean.replace(/%/g, " percent");
  }
  return clean.replace(/\s+/g, " ").trim();
}

function getScoreSpeechSentence(v, lang){
  const r = calc(v, S.amt||v.loan_amount_requested, S.mths||12);
  const isSteady = (r.f[0][2]/r.f[0][1]) >= 0.7;
  const lowCost = (r.f[2][2]/r.f[2][1]) >= 0.7;
  const canRepay = (r.f[1][2]/r.f[1][1]) >= 0.7;
  const manyCust = (r.f[3][2]/r.f[3][1]) >= 0.7;
  const isGenuine = v.reciprocal_transfer_share === 0;
  if(lang==="ta"){
    let reasons = [];
    if(isSteady) reasons.push("உங்கள் வருமானம் நிலையாக உள்ளது");
    if(lowCost) reasons.push("செலவு குறைவாக உள்ளது");
    if(canRepay && reasons.length < 2) reasons.push("திருப்பிச் செலுத்தும் திறன் நன்றாக உள்ளது");
    if(manyCust && reasons.length < 2) reasons.push("வாடிக்கையாளர்கள் அதிகமாக உள்ளனர்");
    if(!isGenuine) reasons = ["பரிவர்த்தனைகளில் கவனம் தேவை"];
    const reasonText = reasons.length ? reasons.join(", ") : "வியாபாரம் இயல்பாக உள்ளது";
    return `உங்கள் நம்பிக்கை மதிப்பெண் 100-க்கு ${r.sc}. ${reasonText}.`;
  } else {
    let reasons = [];
    if(isSteady) reasons.push("your income is steady");
    if(lowCost) reasons.push("your costs are low");
    if(canRepay && reasons.length < 2) reasons.push("your repayment ability is strong");
    if(manyCust && reasons.length < 2) reasons.push("you have many customers");
    if(!isGenuine) reasons = ["warning: money moved back and forth with other vendors"];
    const reasonText = reasons.length ? reasons.join(" and ") : "your sales are active";
    return `Your Trust Score is ${r.sc} out of 100. ${reasonText.charAt(0).toUpperCase() + reasonText.slice(1)}.`;
  }
}

async function checkAudioFiles(){
  if(audioChecked) return audioFilesAvailable;
  try{ const res = await fetch("audio/ta/step1.mp3", {method:"HEAD"}); audioFilesAvailable = res.ok; }
  catch(e){ audioFilesAvailable = false; }
  audioChecked = true;
  return audioFilesAvailable;
}

function getVoicesList(){
  return (typeof window!=="undefined"&&window.speechSynthesis) ? window.speechSynthesis.getVoices() : [];
}
if(typeof window!=="undefined"&&window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = () => { getVoicesList(); };
}

function getVoice(lang){
  const vs = getVoicesList();
  if(lang==="ta"){
    return vs.find(v=>v.lang==="ta-IN"||v.lang==="ta_IN") || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ta"));
  }
  return vs.find(v=>v.lang==="en-IN"||v.lang==="en_IN") || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
}

function hasTamilVoice(){ return !!getVoice("ta"); }

function stopAudio(){
  ttsQueue = []; activeStep = -1; ttsState = "idle";
  if(typeof window!=="undefined"&&window.speechSynthesis){ window.speechSynthesis.cancel(); }
  if(audioEl){ audioEl.pause(); audioEl.currentTime = 0; }
  const m = $("m"); if(m) m.setAttribute("aria-live", "polite");
  highlightStep(-1);
  updateTtsUi();
}

function pauseAudio(){
  if(ttsState!=="playing") return;
  ttsState = "paused";
  if(audioEl && !audioEl.paused){ audioEl.pause(); }
  else if(window.speechSynthesis && window.speechSynthesis.speaking){ window.speechSynthesis.pause(); }
  updateTtsUi();
}

function resumeAudio(){
  if(ttsState!=="paused") return;
  ttsState = "playing";
  if(audioEl && audioEl.src && audioEl.currentTime > 0){ audioEl.play().catch(()=>{}); }
  else if(window.speechSynthesis && window.speechSynthesis.paused){ window.speechSynthesis.resume(); }
  updateTtsUi();
}

function highlightStep(idx){
  document.querySelectorAll(".step-card").forEach((c,i)=>{ c.classList.toggle("active-step", i===idx); });
  if(idx>=0){
    const el = $("step-card-"+idx);
    const reduced = window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(el && !reduced){ el.scrollIntoView({behavior:"smooth",block:"center"}); }
  }
}

function updateTtsUi(){
  const statusEl = $("tts-status"), pauseBtn = $("btn-pause"), stopBtn = $("btn-stop");
  if(pauseBtn){
    pauseBtn.textContent = ttsState==="paused" ? t("resume") : t("pause");
    pauseBtn.disabled = ttsState==="idle";
  }
  if(stopBtn) stopBtn.disabled = ttsState==="idle";
  if(statusEl){
    if(ttsState==="playing") statusEl.textContent = `${t("speaking")} ${activeStep>=0?(activeStep+1)+"/6":""}`;
    else if(ttsState==="paused") statusEl.textContent = t("paused");
    else statusEl.textContent = t("ready");
  }
}

function setSpeed(rate){
  S.rate = rate;
  if(audioEl) audioEl.playbackRate = rate;
  document.querySelectorAll(".speed-btn").forEach(b=>{
    b.classList.toggle("on", parseFloat(b.dataset.r) === rate);
  });
}

async function playNextInQueue(){
  if(!ttsQueue.length){ stopAudio(); return; }
  const item = ttsQueue.shift();
  activeStep = item.stepIdx;
  ttsState = "playing";
  highlightStep(activeStep);
  updateTtsUi();
  const m = $("m"); if(m) m.setAttribute("aria-live", "off");

  const useAudio = await checkAudioFiles();
  if(useAudio && activeStep >= 0){
    if(!audioEl){ audioEl = new Audio(); }
    audioEl.src = `audio/${item.lang}/step${activeStep+1}.mp3`;
    audioEl.playbackRate = S.rate;
    audioEl.onended = () => { playNextInQueue(); };
    audioEl.onerror = () => { speakFallbackText(item); };
    audioEl.play().catch(() => speakFallbackText(item));
  } else {
    speakFallbackText(item);
  }
}

function speakFallbackText(item){
  if(item.lang==="ta" && !hasTamilVoice()){
    const alertEl = $("ta-voice-alert");
    if(alertEl) alertEl.hidden = false;
    setTimeout(() => { playNextInQueue(); }, 1500);
    return;
  }
  const u = new SpeechSynthesisUtterance(prepareSpeechText(item.text, item.lang));
  u.lang = item.lang==="ta" ? "ta-IN" : "en-IN";
  const v = getVoice(item.lang);
  if(v) u.voice = v;
  u.rate = S.rate;
  u.onend = () => { playNextInQueue(); };
  u.onerror = () => { playNextInQueue(); };
  window.speechSynthesis.speak(u);
}

function playStep(idx){
  stopAudio();
  const alertEl = $("ta-voice-alert"); if(alertEl) alertEl.hidden = true;
  const s = STEPS[idx];
  if(S.lang==="ta"){ ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta}); }
  else if(S.lang==="en"){ ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en}); }
  else {
    ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta});
    ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en});
  }
  playNextInQueue();
}

function playAll(){
  stopAudio();
  const alertEl = $("ta-voice-alert"); if(alertEl) alertEl.hidden = true;
  STEPS.forEach((s, idx)=>{
    if(S.lang==="ta"){ ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta}); }
    else if(S.lang==="en"){ ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en}); }
    else {
      ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta});
      ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en});
    }
  });
  playNextInQueue();
}

function speakMyScore(v){
  stopAudio();
  const alertEl = $("ta-voice-alert"); if(alertEl) alertEl.hidden = true;
  if(S.lang==="ta"){ ttsQueue.push({stepIdx:-1, lang:"ta", text:getScoreSpeechSentence(v,"ta")}); }
  else if(S.lang==="en"){ ttsQueue.push({stepIdx:-1, lang:"en", text:getScoreSpeechSentence(v,"en")}); }
  else {
    ttsQueue.push({stepIdx:-1, lang:"ta", text:getScoreSpeechSentence(v,"ta")});
    ttsQueue.push({stepIdx:-1, lang:"en", text:getScoreSpeechSentence(v,"en")});
  }
  playNextInQueue();
}

document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopAudio(); });
window.addEventListener("pagehide", stopAudio);

function render(){
  if(!S.vid) return login();
  nav();
  const v = V();
  $("m").innerHTML = `<div class="scr">${{home,ai,cf,loan,me}[S.tab](v)}</div>`;
  $("m").scrollTop = 0;

  const hdrLangBtn = $("hdrLangBtn");
  if(hdrLangBtn) hdrLangBtn.onclick = toggleLang;

  // Story bar tab switching
  document.querySelectorAll(".story-item").forEach(item => {
    item.onclick = () => {
      stopAudio();
      S.tab = item.dataset.tab;
      render();
    };
  });

  const oai = $("open-ai");
  if(oai) oai.onclick = () => { stopAudio(); S.tab="ai"; render(); };

  if(S.tab=="ai"){
    $("btn-listen-all").onclick = playAll;
    $("btn-pause").onclick = () => { if(ttsState==="paused") resumeAudio(); else pauseAudio(); };
    $("btn-stop").onclick = stopAudio;
    document.querySelectorAll(".speed-btn").forEach(b => b.onclick = () => setSpeed(parseFloat(b.dataset.r)));
    document.querySelectorAll(".step-tts-btn").forEach(b => b.onclick = () => playStep(parseInt(b.dataset.step, 10)));
    $("btn-read-score").onclick = () => speakMyScore(v);
  }

  if(S.tab=="loan"){
    const upd = () => {
      S.amt = +$("a").value;
      S.mths = +$("mo").value;
      const r = calc(v, S.amt, S.mths), c = r.cover>=2?["good","badge-pill--ok"]:r.cover>=1?["ok","badge-pill--wa"]:["risk","badge-pill--bad"];
      $("av").textContent = inr(S.amt);
      $("mv").textContent = S.mths + " months";
      $("ev").textContent = inr(r.emi);
      $("cv").innerHTML = `${t("cov")}: <b>${r.cover.toFixed(1)}x</b>`;
      $("cb").textContent = t(c[0]);
      $("cb").className = `badge-pill ${c[1]}`;
    };
    $("a").oninput = upd;
    $("mo").oninput = upd;
  }

  if(S.tab=="me"){
    document.querySelectorAll("[data-s]").forEach(i => i.onchange = () => S.share[i.dataset.s] = i.checked ? 1 : 0);
    const st = $("st");
    if(st) st.onclick = () => { S.stopped = true; render(); };
    $("lo").onclick = () => { stopAudio(); S.vid = null; render(); };
  }
}

window.TrustCred = { DATA, S, calc, V, inr, t, TX, render, stopAudio };
render();
