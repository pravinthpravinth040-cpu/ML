<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6785;--pri:#2457d6;--ok:#17924f;--wa:#d98a00;--bad:#d03c3c;--bd:#e2e7f2}
@media(prefers-color-scheme:dark){:root:not([data-t=l]){--bg:#0e1424;--card:#182037;--tx:#eef2ff;--mut:#a2aed0;--pri:#6c93ff;--ok:#3fd184;--wa:#f2b13a;--bad:#ff7a7a;--bd:#2a3556}}
:root[data-t=d]{--bg:#0e1424;--card:#182037;--tx:#eef2ff;--mut:#a2aed0;--pri:#6c93ff;--ok:#3fd184;--wa:#f2b13a;--bad:#ff7a7a;--bd:#2a3556}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 'Noto Sans Tamil',Inter,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
main{flex:1;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:22px}h2{font-size:17px;margin-bottom:8px}.mut{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:600 16px inherit;width:100%;padding:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
select,input[type=range]{width:100%;min-height:48px;font:16px inherit;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px}
input[type=range]{padding:0;accent-color:var(--pri)}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mut);font:600 12px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button span{font-size:22px}nav button.on{color:var(--pri)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.gauge{display:block;margin:4px auto}.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;color:#fff}
.alert{border-left:5px solid var(--bad);background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px;border:1px solid var(--bd);border-left:5px solid var(--bad)}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:9px}
.tog{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--bd)}
.tog input{width:24px;height:24px;accent-color:var(--pri)}
.big{font-size:26px;font-weight:800}.lang{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:99px;min-height:48px;padding:0 14px;font:600 14px inherit;cursor:pointer}
.step-card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.step-card.active-step{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,87,214,0.25)}
.step-tts-btn{min-height:48px;min-width:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.tts-ctrls{position:sticky;top:0;z-index:10;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,0.06)}
.speed-group{display:flex;gap:6px;align-items:center;margin-top:10px}
.speed-btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:600 14px inherit;cursor:pointer}
.speed-btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.both-sub{color:var(--mut);font-size:13px;display:block;margin-top:4px;font-weight:400;line-height:1.45}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .6s}.scr{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}}

function calc(v,amt,mths){
  const d=Object.keys(days).map(k=>v.monthly_receipts[k]/days[k]),avg=d.reduce((a,b)=>a+b)/3;
  const cv=Math.sqrt(d.reduce((a,b)=>a+(b-avg)**2,0)/3)/avg, mNet=v.net_cashflow/3;
  const emi=amt*(1+0.2*mths/12)/mths, cover=mNet/emi, er=v.total_expenses/v.total_receipts;
  const f=[["Steady income",25,25*(1-Math.min(cv,.3)/.3),"Daily sales changed "+(cv*100).toFixed(0)+"% between months."],
  ["Can repay",30,30*Math.min(Math.max(cover,0)/3,1),"Monthly savings "+inr(mNet)+" cover a "+inr(emi)+" instalment "+cover.toFixed(1)+"x."],
  ["Low costs",15,15*(1-Math.min(Math.max((er-.1)/.5,0),1)),"Expenses were "+(er*100).toFixed(0)+"% of sales."],
  ["Many customers",15,15*Math.min(v.unique_customers/1000,1),v.unique_customers.toLocaleString("en-IN")+" different customers paid you."],
  ["Genuine sales",15,15*(1-v.reciprocal_transfer_share),v.reciprocal_transfer_share>0?"Money moving between vendors was found.":"No back-and-forth transfers found."]];
  let sc=Math.round(f.reduce((a,x)=>a+x[2],0)); if(v.reciprocal_transfer_share>0) sc=Math.min(sc,40);
  return {f,sc,emi,cover,mNet,cv};
}

    <div class="speed-group">

  <div class="card">${aiDiagram()}</div>
  ${STEPS.map((s,i)=>{

    const body = S.lang=="ta"?`<p>${s.ta}</p>`:S.lang=="both"?`<p style="font-weight:600">${s.ta}</p><p class="both-sub">${s.en}</p>`:`<p>${s.en}</p>`;
    return `<div class="step-card" id="step-card-${i}">

  <div class="card" style="border:2px solid var(--pri)">

function cf(v){const ks=Object.keys(days),vals=ks.map(k=>v.monthly_receipts[k]),mx=Math.max(...vals);
 return `<h1 style="margin-bottom:14px">${t("cf")}</h1><div class="card"><h2>${t("inc")} (Jul – Sep 28)</h2><svg viewBox="0 0 300 150" width="100%" role="img" aria-label="Monthly sales">${vals.map((x,i)=>{const h=x/mx*100;return `<rect x="${30+i*90}" y="${115-h}" width="60" height="${h}" rx="8" fill="var(--pri)"/><text x="${60+i*90}" y="${108-h}" text-anchor="middle" font-size="11" fill="var(--tx)">${inr(x/1000)}k</text><text x="${60+i*90}" y="138" text-anchor="middle" font-size="12" fill="var(--mut)">${MN[ks[i]]}</text>`}).join("")}</svg><p class="mut" style="font-size:12px">Sep covers 28 days only.</p></div>

function loan(v){const r=calc(v,S.amt,S.mths),c=r.cover>=2?["good","var(--ok)"]:r.cover>=1?["ok","var(--wa)"]:["risk","var(--bad)"];
 return `<h1 style="margin-bottom:14px">${t("loan")}</h1><div class="card"><div class="row"><label for="a">${t("req")}</label><b id="av">${inr(S.amt)}</b></div><input id="a" type="range" min="10000" max="100000" step="5000" value="${S.amt}"><div class="row" style="margin-top:12px"><label for="mo">${t("mon")}</label><b id="mv">${S.mths}</b></div><input id="mo" type="range" min="6" max="24" step="3" value="${S.mths}"></div>
 <div class="card" style="text-align:center"><p class="mut">${t("emi")}</p><p class="big" id="ev">${inr(r.emi)}</p><p class="mut" id="cv">${t("cov")} ${r.cover.toFixed(1)}x</p><span class="badge" id="cb" style="background:${c[1]}">${t(c[0])}</span><p class="mut" style="font-size:12px;margin-top:8px">${t("ill")}</p></div>
 <div class="card"><h2>${t("tips")}</h2><p class="mut">• Take UPI payments from many customers.<br>• Keep sales steady through the month.<br>• Do not move money back and forth with other vendors.</p></div>`}

function me(v){const o=[["r","Score report"],["e","Reasons for the score"],["m","Monthly summary"],["c","Payment documents"]];
 return `<h1 style="margin-bottom:14px">${t("me")} · ${v.vendor_id}</h1><div class="card"><h2>${t("share")}</h2><p class="mut" style="margin-bottom:6px">${t("shareT")}</p>${S.stopped?`<p class="alert" style="border-left-color:var(--ok)">✔ ${t("stopped")}</p>`:o.map(x=>`<label class="tog">${x[1]}<input type="checkbox" data-s="${x[0]}" ${S.share[x[0]]?"checked":""}></label>`).join("")+`<div style="height:12px"></div><button class="btn ghost" id="st">${t("stop")}</button>`}</div><button class="btn ghost" id="lo">${t("out")}</button><div style="height:12px"></div><a href="index.html" class="btn ghost" style="text-decoration:none;display:flex;align-items:center;justify-content:center">🏢 Underwriter Dashboard</a>`}

// Speech & TTS Engine
let ttsState="idle", activeStep=-1, ttsQueue=[], audioEl=null, audioFilesAvailable=false, audioChecked=false;

function prepareSpeechText(text, lang){
  if(!text) return "";
  let clean = text.replace(/<[^>]+>/g, " ");
  if(lang==="ta"){
    clean = clean.replace(/₹\s*([0-9,]+)/g, "$1 ரூபாய் ");
    clean = clean.replace(/₹/g, "ரூபாய் ");
    clean = clean.replace(/%/g, " சதவீதம்");
  } else {
    clean = clean.replace(/₹\s*([0-9,]+)/g, "$1 rupees ");
    clean = clean.replace(/₹/g, "rupees ");
    clean = clean.replace(/%/g, " percent");
  }
  return clean.replace(/\s+/g, " ").trim();
}

function getScoreSpeechSentence(v, lang){
  const r = calc(v, S.amt||v.loan_amount_requested, S.mths||12);
  const isSteady = (r.f[0][2]/r.f[0][1]) >= 0.7;
  const lowCost = (r.f[2][2]/r.f[2][1]) >= 0.7;
  const canRepay = (r.f[1][2]/r.f[1][1]) >= 0.7;
  const manyCust = (r.f[3][2]/r.f[3][1]) >= 0.7;
  const isGenuine = v.reciprocal_transfer_share === 0;
  if(lang==="ta"){
    let reasons = [];
    if(isSteady) reasons.push("உங்கள் வருமானம் நிலையாக உள்ளது");
    if(lowCost) reasons.push("செலவு குறைவாக உள்ளது");
    if(canRepay && reasons.length < 2) reasons.push("திருப்பிச் செலுத்தும் திறன் நன்றாக உள்ளது");
    if(manyCust && reasons.length < 2) reasons.push("வாடிக்கையாளர்கள் அதிகமாக உள்ளனர்");
    if(!isGenuine) reasons = ["பரிவர்த்தனைகளில் கவனம் தேவை"];
    const reasonText = reasons.length ? reasons.join(", ") : "வியாபாரம் இயல்பாக உள்ளது";
    return `உங்கள் நம்பிக்கை மதிப்பெண் 100-க்கு ${r.sc}. ${reasonText}.`;
  } else {
    let reasons = [];
    if(isSteady) reasons.push("your income is steady");
    if(lowCost) reasons.push("your costs are low");
    if(canRepay && reasons.length < 2) reasons.push("your repayment ability is strong");
    if(manyCust && reasons.length < 2) reasons.push("you have many customers");
    if(!isGenuine) reasons = ["warning: money moved back and forth with other vendors"];
    const reasonText = reasons.length ? reasons.join(" and ") : "your sales are active";
    return `Your Trust Score is ${r.sc} out of 100. ${reasonText.charAt(0).toUpperCase() + reasonText.slice(1)}.`;
  }
}

async function checkAudioFiles(){
  if(audioChecked) return audioFilesAvailable;
  try{const res = await fetch("audio/ta/step1.mp3", {method:"HEAD"}); audioFilesAvailable = res.ok;}
  catch(e){audioFilesAvailable = false;}
  audioChecked = true;
  return audioFilesAvailable;
}

function getVoicesList(){
  return (typeof window!=="undefined"&&window.speechSynthesis)?window.speechSynthesis.getVoices():[];
}
if(typeof window!=="undefined"&&window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged=()=>{getVoicesList()};
}

function getVoice(lang){
  const vs = getVoicesList();
  if(lang==="ta"){
    return vs.find(v=>v.lang==="ta-IN"||v.lang==="ta_IN") || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ta"));
  }
  return vs.find(v=>v.lang==="en-IN"||v.lang==="en_IN") || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
}

function hasTamilVoice(){ return !!getVoice("ta"); }

function stopAudio(){
  ttsQueue = []; activeStep = -1; ttsState = "idle";
  if(typeof window!=="undefined"&&window.speechSynthesis){ window.speechSynthesis.cancel(); }
  if(audioEl){ audioEl.pause(); audioEl.currentTime = 0; }
  const m = $("m"); if(m) m.setAttribute("aria-live", "polite");
  highlightStep(-1);
  updateTtsUi();
}

function pauseAudio(){
  if(ttsState!=="playing") return;
  ttsState = "paused";
  if(audioEl && !audioEl.paused){ audioEl.pause(); }
  else if(window.speechSynthesis && window.speechSynthesis.speaking){ window.speechSynthesis.pause(); }
  updateTtsUi();
}

function resumeAudio(){
  if(ttsState!=="paused") return;
  ttsState = "playing";
  if(audioEl && audioEl.src && audioEl.currentTime > 0){ audioEl.play().catch(()=>{}); }
  else if(window.speechSynthesis && window.speechSynthesis.paused){ window.speechSynthesis.resume(); }
  updateTtsUi();
}

function highlightStep(idx){
  document.querySelectorAll(".step-card").forEach((c,i)=>{ c.classList.toggle("active-step", i===idx); });
  if(idx>=0){
    const el = $("step-card-"+idx);
    const reduced = window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(el && !reduced){ el.scrollIntoView({behavior:"smooth",block:"center"}); }
  }
}

function updateTtsUi(){
  const statusEl = $("tts-status"), pauseBtn = $("btn-pause"), stopBtn = $("btn-stop");
  if(pauseBtn){
    pauseBtn.textContent = ttsState==="paused" ? t("resume") : t("pause");
    pauseBtn.disabled = ttsState==="idle";
  }
  if(stopBtn) stopBtn.disabled = ttsState==="idle";
  if(statusEl){
    if(ttsState==="playing") statusEl.textContent = `${t("speaking")} ${activeStep>=0?(activeStep+1)+"/6":""}`;
    else if(ttsState==="paused") statusEl.textContent = t("paused");
    else statusEl.textContent = t("ready");
  }
}

function setSpeed(rate){
  S.rate = rate;
  if(audioEl) audioEl.playbackRate = rate;
  document.querySelectorAll(".speed-btn").forEach(b=>{
    b.classList.toggle("on", parseFloat(b.dataset.r) === rate);
  });
}

async function playNextInQueue(){
  if(!ttsQueue.length){ stopAudio(); return; }
  const item = ttsQueue.shift();
  activeStep = item.stepIdx;
  ttsState = "playing";
  highlightStep(activeStep);
  updateTtsUi();
  const m = $("m"); if(m) m.setAttribute("aria-live", "off");

  const useAudio = await checkAudioFiles();
  if(useAudio && activeStep >= 0){
    if(!audioEl){ audioEl = new Audio(); }
    audioEl.src = `audio/${item.lang}/step${activeStep+1}.mp3`;
    audioEl.playbackRate = S.rate;
    audioEl.onended = () => { playNextInQueue(); };
    audioEl.onerror = () => { speakFallbackText(item); };
    audioEl.play().catch(() => speakFallbackText(item));
  } else {
    speakFallbackText(item);
  }
}

function speakFallbackText(item){
  if(item.lang==="ta" && !hasTamilVoice()){
    const alertEl = $("ta-voice-alert");
    if(alertEl) alertEl.hidden = false;
    setTimeout(() => { playNextInQueue(); }, 1500);
    return;
  }
  const u = new SpeechSynthesisUtterance(prepareSpeechText(item.text, item.lang));
  u.lang = item.lang==="ta" ? "ta-IN" : "en-IN";
  const v = getVoice(item.lang);
  if(v) u.voice = v;
  u.rate = S.rate;
  u.onend = () => { playNextInQueue(); };
  u.onerror = () => { playNextInQueue(); };
  window.speechSynthesis.speak(u);
}

function playStep(idx){
  stopAudio();
  const alertEl = $("ta-voice-alert"); if(alertEl) alertEl.hidden = true;
  const s = STEPS[idx];
  if(S.lang==="ta"){ ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta}); }
  else if(S.lang==="en"){ ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en}); }
  else {
    ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta});
    ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en});
  }
  playNextInQueue();
}

function playAll(){
  stopAudio();
  const alertEl = $("ta-voice-alert"); if(alertEl) alertEl.hidden = true;
  STEPS.forEach((s, idx)=>{
    if(S.lang==="ta"){ ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta}); }
    else if(S.lang==="en"){ ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en}); }
    else {
      ttsQueue.push({stepIdx:idx, lang:"ta", text:s.titleTa + ". " + s.ta});
      ttsQueue.push({stepIdx:idx, lang:"en", text:s.titleEn + ". " + s.en});
    }
  });
  playNextInQueue();
}

function speakMyScore(v){
  stopAudio();
  const alertEl = $("ta-voice-alert"); if(alertEl) alertEl.hidden = true;
  if(S.lang==="ta"){ ttsQueue.push({stepIdx:-1, lang:"ta", text:getScoreSpeechSentence(v,"ta")}); }
  else if(S.lang==="en"){ ttsQueue.push({stepIdx:-1, lang:"en", text:getScoreSpeechSentence(v,"en")}); }
  else {
    ttsQueue.push({stepIdx:-1, lang:"ta", text:getScoreSpeechSentence(v,"ta")});
    ttsQueue.push({stepIdx:-1, lang:"en", text:getScoreSpeechSentence(v,"en")});
  }
  playNextInQueue();
}

document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopAudio(); });
window.addEventListener("pagehide", stopAudio);

function render(){if(!S.vid)return login();nav();const v=V();
 $("m").innerHTML=`<div class="scr">${{home,ai,cf,loan,me}[S.tab](v)}</div>`;$("m").scrollTop=0;
 const lg=$("lg");if(lg)lg.onclick=toggleLang;
 const oai=$("open-ai");if(oai)oai.onclick=()=>{stopAudio();S.tab="ai";render()};
 if(S.tab=="ai"){
   $("btn-listen-all").onclick = playAll;
   $("btn-pause").onclick = () => { if(ttsState==="paused") resumeAudio(); else pauseAudio(); };
   $("btn-stop").onclick = stopAudio;
   document.querySelectorAll(".speed-btn").forEach(b => b.onclick = () => setSpeed(parseFloat(b.dataset.r)));
   document.querySelectorAll(".step-tts-btn").forEach(b => b.onclick = () => playStep(parseInt(b.dataset.step, 10)));
   $("btn-read-score").onclick = () => speakMyScore(v);
 }
 if(S.tab=="loan"){const upd=()=>{S.amt=+$("a").value;S.mths=+$("mo").value;const r=calc(v,S.amt,S.mths),c=r.cover>=2?["good","var(--ok)"]:r.cover>=1?["ok","var(--wa)"]:["risk","var(--bad)"];
  $("av").textContent=inr(S.amt);$("mv").textContent=S.mths;$("ev").textContent=inr(r.emi);$("cv").textContent=t("cov")+" "+r.cover.toFixed(1)+"x";$("cb").textContent=t(c[0]);$("cb").style.background=c[1]};$("a").oninput=upd;$("mo").oninput=upd}
 if(S.tab=="me"){
  document.querySelectorAll("[data-s]").forEach(i=>i.onchange=()=>S.share[i.dataset.s]=i.checked?1:0);
  const st=$("st");if(st)st.onclick=()=>{S.stopped=true;render()};$("lo").onclick=()=>{stopAudio();S.vid=null;render()}
 }
}
window.TrustCred = { DATA, S, calc, V, inr, t, TX, render, stopAudio };
render();
